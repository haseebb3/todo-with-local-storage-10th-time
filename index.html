<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>
  <h3 class="bg-secondary text-center p-2">todo with local storage 10th time</h3>
  <div class="container-fluid">
    <div class="row mt-4">
      <div class="col-md-4 mb-4  offset-md-1">
        <div class="card">
          <div class="card-header bg-secondary">
            <h2>Add Your Todos</h2>
          </div>
          <div class="card-body">
            <form id="todoForm">
              <div class="form-group">
                <label for="todoItem">Todo Item</label>
                <input required type="text" id="todoItem" class="form-control">
              </div>
              <button class="btn btn-sm btn-info btn-block" id="addTodoBtn">Add Todo</button>
              <button type="button" class="btn btn-sm btn-info btn-block d-none" id="updateTodoBtn">Update Todo</button>
            </form>
          </div>
        </div>
      </div>

      <div class="col-md-6">
        <div class="card">
          <div class="card-header bg-secondary">
            <h2>Your Todos</h2>
          </div>
          <div class="card-body">
            <ul class="list-group" id="todosContainer">
              <!-- <li class="list-group-item d-flex justify-content-between">
                <strong>Html</strong>
                <div>
                  <button class="btn btn-sm btn-info mr-2">Edit</button>
                  <button class="btn btn-sm btn-danger">Delete</button>
                </div>
              </li> -->
            </ul>
          </div>

        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="./assets/js/app.js"></script>
</body>

</html>
